name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 测试与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true

      - name: gofmt 检查
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "以下文件需要 gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: go build
        run: go build ./...

      # 前端是无构建步骤的原生 ES 模块，只做语法校验。
      # --check 查不出「import 路径写错但语法合法」——那类错误的
      # 表现是页面能开、接口全通、交互静默失效，只能靠路径校验发现。
      - name: 前端 JS 语法与 import 路径校验
        run: |
          fail=0
          while IFS= read -r f; do
            node --check "$f" || fail=1
          done < <(find internal/webui/web -name '*.js' -type f)
          python3 scripts/check-js-imports.py || fail=1
          exit $fail

      # 网关等效端到端验证。
      #
      # 真机上「页面卡在正在加载界面」这类问题，本机 curl localhost 是测不出来的
      # ——那时请求根本没经过统一网关。这里用 HTTP 代理复刻网关的两种转发方式，
      # 把浏览器视角的完整加载链路（尾斜杠自愈 / 资源 / 递归 import 图 /
      # 首屏单请求 / 鉴权边界 / 深链接回退）逐条跑一遍。
      - name: 飞牛网关等效端到端验证
        run: |
          go build -o qlink2desktop ./cmd/server
          python3 scripts/e2e-gateway-check.py --exe ./qlink2desktop

  fpk:
    name: 打包飞牛 .fpk（${{ matrix.arch }}）
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, arm]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true

      - name: 构建 ${{ matrix.arch }} 安装包
        run: ./scripts/build-fpk.sh ${{ matrix.arch }}

      - name: 校验包结构
        run: |
          set -e
          # 版本号唯一来源是仓库根目录的 VERSION 文件，产物名里也带着它。
          ver="$(tr -d '[:space:]' < VERSION)"
          pkg="qlink2desktop-${ver}-${{ matrix.arch }}.fpk"
          echo "校验 $pkg"
          work="$(mktemp -d)"
          tar -xzf "$pkg" -C "$work"

          # 官方 fnpack 的打包检查清单。
          #
          # 注意 app 是 **app.tgz 文件**，不是 app/ 目录 —— 之前这里写成
          # [ -d app ] 导致 CI 在这一步必然失败。app.tgz 解开后才是
          # 安装到 target/ 的内容。
          for f in manifest app.tgz ICON.PNG ICON_256.PNG; do
            [ -s "$work/$f" ] || { echo "缺少 $f"; exit 1; }
          done
          for d in cmd config wizard; do
            [ -d "$work/$d" ] || { echo "缺少目录 $d/"; exit 1; }
          done
          grep -q '^checksum' "$work/manifest" || { echo "manifest 缺少 checksum"; exit 1; }

          # manifest 里的版本号必须与 VERSION 文件一致，
          # 否则发出去的包叫什么版本、装上去是什么版本会对不上。
          grep -Eq "^version[[:space:]]*=[[:space:]]*${ver}[[:space:]]*$" "$work/manifest" \
            || { echo "manifest 版本号与 VERSION 文件不一致（期望 ${ver}）"; exit 1; }

          # platform 必须与目标架构一致，否则另一类设备装上后起不来。
          case "${{ matrix.arch }}" in
            x86) want=x86 ;;
            arm) want=arm ;;
          esac
          grep -Eq "^platform[[:space:]]*=[[:space:]]*${want}[[:space:]]*$" "$work/manifest" \
            || { echo "manifest platform 与 ${{ matrix.arch }} 不一致"; exit 1; }

          # app.tgz 里必须真的有二进制，且是目标架构的 ELF。
          tar -xzf "$work/app.tgz" -C "$work"
          bin="$work/qlink2desktop"
          [ -s "$bin" ] || { echo "app.tgz 缺少二进制"; exit 1; }
          machine="$(python3 -c "import sys;d=open(sys.argv[1],'rb').read(20);print(int.from_bytes(d[18:20],'little'))" "$bin")"
          case "${{ matrix.arch }}" in
            x86) [ "$machine" = "62" ] || { echo "期望 x86-64 ELF，实际 machine=$machine"; exit 1; } ;;
            arm) [ "$machine" = "183" ] || { echo "期望 aarch64 ELF，实际 machine=$machine"; exit 1; } ;;
          esac

          # 打包后的二进制里必须带启动期守卫脚本与看门狗。
          # 少了它们，桌面 iframe 拿到无斜杠文档 URL 时全部资源 404 → 白屏，
          # 而且页面不会给出任何可排查的信息。这是真机上排查最久的一类问题，
          # 务必在发版前拦住。
          grep -aq 'location.replace' "$bin" \
            || { echo "二进制里缺少尾斜杠守卫脚本，桌面 iframe 会白屏"; exit 1; }
          grep -aq '__qlinkDiag' "$bin" \
            || { echo "二进制里缺少启动期看门狗，失败时无法自诊断"; exit 1; }

          echo "包结构校验通过：$pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: qlink2desktop-${{ matrix.arch }}
          path: qlink2desktop-*-${{ matrix.arch }}.fpk
          if-no-files-found: error

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: fpk
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: 汇总产物
        run: ls -lh *.fpk

      - name: 创建 Release 并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          files: "*.fpk"
          generate_release_notes: false
          body: |
            ## 安装

            1. 按设备 CPU 架构选择安装包（文件名里带版本号）：
               - **x86**（常见于 Intel / AMD 平台）：`qlink2desktop-<版本>-x86.fpk`
               - **arm**（常见于 ARM 盒子 / 树莓派类设备）：`qlink2desktop-<版本>-arm.fpk`
            2. 飞牛 OS → 应用中心 → 右上角「手动安装」→ 选择 `.fpk` 文件。
            3. 安装完成后桌面会出现「QLink2Desktop」图标。

            > 若应用中心提示"已是最新"或拒绝覆盖安装，请先卸载旧版再安装。
            > 启动页左下角会显示当前版本号（`v<版本>`），可用来确认装的是哪一版。
